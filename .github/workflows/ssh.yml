name: SSH Remote Runner
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Session & Publish IP
        run: |
          sudo apt-get update && sudo apt-get install -y tmate
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          SSH_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          echo "SSH Command: $SSH_CMD"
          curl -d "$SSH_CMD" https://ntfy.sh/ldi_runner_ssh_secret_99
          tmate -S /tmp/tmate.sock attach
