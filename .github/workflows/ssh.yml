name: SSH Remote Runner
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Background Publisher to ntfy
        run: |
          (
            for i in {1..30}; do
              SOCK=$(find /tmp -name "*tmate*.sock" 2>/dev/null | head -n 1)
              if [ -n "$SOCK" ]; then
                SSH_STR=$(tmate -S "$SOCK" display -p '#{tmate_ssh}' 2>/dev/null)
                if [ -n "$SSH_STR" ]; then
                  curl -s -d "$SSH_STR" https://ntfy.sh/ldi_runner_ssh_secret_99
                  break
                fi
              fi
              sleep 2
            done
          ) &

      - name: Setup SSH Session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false
